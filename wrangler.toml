name = "english-cbt"
main = "worker/src/index.ts"
compatibility_date = "2026-10-01"

# 사용자 지정 도메인 (DNS 레코드와 인증서는 Cloudflare가 자동 생성)
# 학교 도메인 하나로만 서비스 (workers.dev 주소 사용 안 함)
workers_dev = false
routes = [
  { pattern = "english-cbt.allforedu.kr", custom_domain = true },
]

# wrangler deploy / wrangler dev 실행 전에 프론트엔드를 먼저 빌드합니다.
# (Cloudflare Workers Builds에서 빌드 명령을 비워 두어도 dist/가 만들어짐)
[build]
command = "npm run build"
watch_dir = ["web/src", "shared"]

# 프론트엔드(Vite 빌드 결과)를 Workers Static Assets로 제공합니다.
# /api/* 는 항상 Worker가 먼저 처리하고, 그 외 경로는 SPA(index.html)로 연결됩니다.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "english-cbt"
database_id = "9fc40049-21fd-4142-812b-5cc9a5a56bfb"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "english-cbt-media"

# 시간이 지난 응시를 서버 기준으로 마감·채점합니다.
[triggers]
crons = ["*/5 * * * *"]

[vars]
# Cloudflare Access를 사용할 경우 아래 두 값을 설정하세요. (비워 두면 비밀번호 로그인만 사용)
ACCESS_TEAM_DOMAIN = "allforedu.cloudflareaccess.com"
ACCESS_AUD = "4db92c559f8f99fb0ebcc6d62b54eff95538d61bf0f96997887d7d8fb55361a3"
# Access 인증 시 자동으로 관리자 계정을 만들어 줄 교사 이메일 (쉼표 구분)
ADMIN_EMAILS = ""

# 비밀값(APP_SECRET, SETUP_TOKEN)은 wrangler secret put 으로 등록합니다. (.dev.vars.example 참고)
