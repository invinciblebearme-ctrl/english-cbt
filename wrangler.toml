name = "english-cbt"
main = "worker/src/index.ts"
compatibility_date = "2026-10-01"

# 프론트엔드(Vite 빌드 결과)를 Workers Static Assets로 제공합니다.
# /api/* 는 항상 Worker가 먼저 처리하고, 그 외 경로는 SPA(index.html)로 연결됩니다.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "english-cbt"
database_id = "9fc40049-21fd-4142-812b-5cc9a5a56bfb"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "english-cbt-media"

# 시간이 지난 응시를 서버 기준으로 마감·채점합니다.
[triggers]
crons = ["*/5 * * * *"]

[vars]
# Cloudflare Access를 사용할 경우 아래 두 값을 설정하세요. (비워 두면 비밀번호 로그인만 사용)
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
# Access 인증 시 자동으로 관리자 계정을 만들어 줄 교사 이메일 (쉼표 구분)
ADMIN_EMAILS = ""

# 비밀값(APP_SECRET, SETUP_TOKEN)은 wrangler secret put 으로 등록합니다. (.dev.vars.example 참고)
