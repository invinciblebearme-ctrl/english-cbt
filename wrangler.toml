[build]
command = "npm run build"
watch_dir = ["web/src", "shared"]

# ?꾨줎?몄뿏??Vite 鍮뚮뱶 寃곌낵)瑜?Workers Static Assets濡??쒓났?⑸땲??
# /api/* ????긽 Worker媛 癒쇱? 泥섎━?섍퀬, 洹???寃쎈줈??SPA(index.html)濡??곌껐?⑸땲??
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "english-cbt"
database_id = "9fc40049-21fd-4142-812b-5cc9a5a56bfb"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "english-cbt-media"

