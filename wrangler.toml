name = "english-cbt"
main = "worker/src/index.ts"
compatibility_date = "2026-10-01"

# ?ъ슜??吏???꾨찓??(DNS ?덉퐫?쒖? ?몄쬆?쒕뒗 Cloudflare媛 ?먮룞 ?앹꽦)
# 학교 도메인 하나로만 서비스 (workers.dev 주소 사용 안 함)
workers_dev = false
routes = [
  { pattern = "english-cbt.allforedu.kr", custom_domain = true },
]

