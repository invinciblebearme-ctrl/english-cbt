<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English CBT · Prototype</title><style>:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#182b49;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}header{background:#153e79;color:white;padding:20px 5vw;display:flex;justify-content:space-between;align-items:center;gap:12px}header h1{margin:0;font-size:24px}header small{opacity:.8}main{max-width:1050px;margin:26px auto;padding:0 16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}button{border:0;border-radius:9px;padding:11px 16px;background:#e4ebf5;color:#173d72;cursor:pointer;font-weight:700}button.primary{background:#1763c6;color:white}button.danger{background:#fee8e8;color:#a42626}button:disabled{opacity:.5;cursor:not-allowed}.card{background:white;border-radius:16px;padding:24px;margin-bottom:16px;box-shadow:0 5px 22px #153e7910}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:155px;margin:8px 0}input,select,textarea{width:100%;padding:11px;border:1px solid #cdd8e6;border-radius:8px;font:inherit}textarea{min-height:85px}.muted{color:#65768d}.badge{background:#eaf3ff;padding:4px 9px;border-radius:8px;font-size:12px}.item{padding:13px;border-bottom:1px solid #edf0f5;display:flex;justify-content:space-between;gap:12px;align-items:center}.item:last-child{border:0}.choices{display:grid;gap:9px;margin:15px 0}.choice{display:block;border:1px solid #d5e0ed;padding:12px;border-radius:10px;cursor:pointer}.choice:has(input:checked){border-color:#1763c6;background:#edf5ff}.choice input{width:auto}.preview{max-width:300px;max-height:180px;display:block;margin:12px 0}.notice{padding:12px;border-radius:10px;background:#fff6dc;color:#6a4b00;margin-bottom:14px}.success{background:#e7f7ed;color:#14633a}.error{background:#ffeaea;color:#9e2020}.hidden{display:none}.question-nav{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}.question-nav button{padding:9px 12px}.active{outline:2px solid #1763c6}footer{max-width:1050px;margin:25px auto;padding:0 16px;color:#6d7c90;font-size:13px}@media(max-width:600px){.card{padding:16px}header{display:block}}</style></head><body><header><div><h1>English CBT</h1><small>문제은행 · 시험 생성 · 학생 응시</small></div><span class="badge">로컬 기능 시연용</span></header><main><div class="tabs"><button onclick="tab('bank')">문제은행</button><button onclick="tab('exams')">시험 관리</button><button onclick="tab('students')">학생 응시</button><button onclick="tab('results')">결과 관리</button></div><div id="app"></div></main><footer>⚠ 시연용 프로토타입입니다. 데이터는 현재 브라우저에만 저장됩니다. 실제 학생 개인정보를 입력하지 마세요. 실서비스에는 서버 인증·DB·R2 저장소가 필요합니다.</footer><script>
const KEY='english_cbt_demo_v2';let db=JSON.parse(localStorage.getItem(KEY)||'{"questions":[],"exams":[],"attempts":[]}'),view='bank',editing=null,examAt=0,student=null,questionAt=0,answers={};const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const id=()=>crypto.randomUUID();const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const val=x=>$(x).value;const notify=(s,cls='success')=>{let e=$('msg');if(e){e.className='notice '+cls;e.textContent=s}};function tab(v){view=v;editing=null;student=null;render()}function render(){if(view==='bank')bank();if(view==='exams')exams();if(view==='students')students();if(view==='results')results()}
function bank(){let q=editing?db.questions.find(x=>x.id===editing):null;$('app').innerHTML=`<div class="card"><h2>${q?'문제 수정':'새 문제 등록'}</h2><p class="muted">문제만 먼저 저장할 수 있습니다. 이미지·음성·정답은 나중에 추가하세요.</p><div id="msg"></div><div class="row"><label class="field">학년<select id="grade">${[3,4,5,6].map(n=>`<option ${q?.grade==n?'selected':''}>${n}</option>`).join('')}</select></label><label class="field">단원<input id="unit" type="number" min="1" max="20" value="${esc(q?.unit||9)}"></label><label class="field">영역<select id="domain">${['듣기','읽기','쓰기'].map(n=>`<option ${q?.domain===n?'selected':''}>${n}</option>`).join('')}</select></label><label class="field">유형<select id="type" onchange="toggleType()">${[['single','객관식'],['ox','O/X'],['short','단답형'],['sentence','문장 쓰기']].map(([a,b])=>`<option value="${a}" ${q?.type===a?'selected':''}>${b}</option>`).join('')}</select></label></div><label class="field">문제 내용<textarea id="prompt">${esc(q?.prompt)}</textarea></label><label class="field">선택지 (객관식: 한 줄에 하나씩)<textarea id="options">${esc((q?.options||[]).join('\n'))}</textarea></label><label class="field">정답 (객관식은 1~5, O/X는 O 또는 X)<input id="answer" value="${esc(q?.answer)}"></label><div class="row"><label class="field">배점<input id="points" type="number" min="1" value="${q?.points||5}"></label><label class="field">그림 파일<input id="image" type="file" accept="image/*"></label><label class="field">음성 파일<input id="audio" type="file" accept="audio/*"></label></div><p class="muted">첨부파일은 시연용으로 작은 파일만 브라우저에 저장됩니다. 대용량 파일은 실서비스에서 R2로 업로드합니다.</p><div class="row"><button class="primary" onclick="saveQuestion()">${q?'수정 저장':'문제 저장'}</button><button onclick="editing=null;bank()">새 문제</button></div></div><div class="card"><h2>등록된 문제 (${db.questions.length})</h2><div class="row"><label class="field">학년 필터<select id="filter" onchange="listQuestions()"><option value="">전체</option>${[3,4,5,6].map(n=>`<option>${n}</option>`).join('')}</select></label></div><div id="questionList"></div></div>`;listQuestions()}
function toggleType(){$('options').disabled=['short','sentence','ox'].includes(val('type'))}function fileData(f){return new Promise((resolve,reject)=>{if(!f)return resolve(null);if(f.size>700000)return reject(Error('시연용 첨부파일은 700KB 이하만 지원합니다.'));let r=new FileReader;r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('파일 읽기 실패'));r.readAsDataURL(f)})}async function saveQuestion(){try{let old=editing?db.questions.find(x=>x.id===editing):null;let prompt=val('prompt').trim();if(!prompt)return notify('문제 내용을 입력하세요.','error');let image=await fileData($('image').files[0]),audio=await fileData($('audio').files[0]);let q={id:old?.id||id(),grade:+val('grade'),unit:+val('unit'),domain:val('domain'),type:val('type'),prompt,options:val('options').split('\n').map(x=>x.trim()).filter(Boolean),answer:val('answer').trim(),points:+val('points'),image:image||old?.image||null,audio:audio||old?.audio||null};if(old)Object.assign(old,q);else db.questions.push(q);save();editing=null;bank();notify('문제를 저장했습니다.')}catch(e){notify(e.message,'error')}}function listQuestions(){let f=val('filter'),qs=db.questions.filter(q=>!f||q.grade==f);$('questionList').innerHTML=qs.length?qs.map(q=>`<div class="item"><div><b>${q.grade}학년 ${q.unit}단원 · ${esc(q.domain)}</b> <span class="badge">${esc(q.type)}</span><br>${esc(q.prompt)}<br><small class="muted">${q.answer?'정답 등록':'정답 미등록'} · ${q.image?'그림 있음':'그림 없음'} · ${q.audio?'음성 있음':'음성 없음'}</small></div><div class="row"><button onclick="editing='${q.id}';bank()">수정</button><button onclick="duplicate('${q.id}')">복제</button><button class="danger" onclick="removeQ('${q.id}')">삭제</button></div></div>`).join(''):'<p class="muted">등록된 문제가 없습니다.</p>'}function duplicate(i){let q=db.questions.find(x=>x.id===i);db.questions.push({...q,id:id(),prompt:q.prompt+' (복제)'});save();bank()}function removeQ(i){if(!confirm('문제은행에서 삭제할까요? 이미 생성한 시험에는 영향을 주지 않습니다.'))return;db.questions=db.questions.filter(q=>q.id!==i);save();bank()}
function ready(q){return !!q.answer&&(q.type!=='single'||q.options.length>=2)}function exams(){$('app').innerHTML=`<div class="card"><h2>시험 생성</h2><div id="msg"></div><div class="row"><label class="field">시험 이름<input id="examTitle" value="4학년 9단원 평가"></label><label class="field">응시 코드<input id="examCode" value="${'ENG-'+Math.random().toString(36).slice(2,8).toUpperCase()}"></label><label class="field">제한 시간(분)<input id="minutes" type="number" min="1" value="40"></label></div><p class="muted">정답이 있는 문제만 시험에 추가할 수 있습니다. 시험 생성 시 문항을 복사하여 이후 문제은행 수정과 분리합니다.</p><h3>문제 선택</h3>${db.questions.filter(ready).map(q=>`<label class="choice"><input class="pick" type="checkbox" value="${q.id}"> ${q.grade}학년 ${q.unit}단원 · ${esc(q.prompt)}</label>`).join('')||'<p class="muted">정답이 등록된 문제가 없습니다.</p>'}<button class="primary" onclick="createExam()">선택한 문제로 시험 만들기</button></div><div class="card"><h2>시험 목록</h2>${db.exams.map(e=>`<div class="item"><div><b>${esc(e.title)}</b> <span class="badge">${e.questions.length}문항</span><br><span class="muted">응시 코드: ${esc(e.code)} · ${e.minutes}분</span></div><button onclick="copyCode('${e.id}')">코드 복사</button></div>`).join('')||'<p class="muted">생성된 시험이 없습니다.</p>'}</div>`}function createExam(){let ids=[...document.querySelectorAll('.pick:checked')].map(x=>x.value),code=val('examCode').trim().toUpperCase();if(!ids.length)return notify('문제를 선택하세요.','error');if(!code||db.exams.some(e=>e.code===code))return notify('고유한 응시 코드를 입력하세요.','error');db.exams.push({id:id(),title:val('examTitle').trim()||'새 시험',code,minutes:+val('minutes')||40,questions:ids.map(i=>structuredClone(db.questions.find(q=>q.id===i)))});save();exams();notify('시험을 생성했습니다.')}function copyCode(i){let e=db.exams.find(x=>x.id===i);navigator.clipboard?.writeText(e.code).then(()=>alert('코드를 복사했습니다: '+e.code)).catch(()=>alert(e.code))}
function students(){if(student)return take();$('app').innerHTML=`<div class="card"><h2>학생 응시</h2><div class="notice">현재는 기능 시연용입니다. 실제 학생 이름이나 개인정보 대신 가상 학생 정보를 입력하세요.</div><div id="msg"></div><div class="row"><label class="field">학년<input id="sg" type="number" value="4"></label><label class="field">반<input id="sc" type="number" value="1"></label><label class="field">번호<input id="sn" type="number" value="1"></label><label class="field">이름(가명)<input id="sname" value="테스트학생"></label></div><label class="field">응시 코드<input id="scode" placeholder="ENG-XXXXXX"></label><button class="primary" onclick="startExam()">시험 시작</button></div>`}function startExam(){let e=db.exams.find(x=>x.code===val('scode').trim().toUpperCase());if(!e)return notify('응시 코드를 확인하세요.','error');let label=[val('sg'),val('sc'),val('sn'),val('sname')].join('-');if(db.attempts.some(a=>a.examId===e.id&&a.label===label))return notify('이미 제출한 응시 기록이 있습니다.','error');student={exam:e,label,started:Date.now()};answers={};questionAt=0;take()}
function take(){let e=student.exam,q=e.questions[questionAt],a=answers[q.id]||'';let content=q.type==='single'?`<div class="choices">${q.options.map((o,i)=>`<label class="choice"><input type="radio" name="choice" value="${i+1}" ${a===String(i+1)?'checked':''} onchange="setAnswer(this.value)"> ${i+1}. ${esc(o)}</label>`).join('')}</div>`:q.type==='ox'?`<div class="choices">${['O','X'].map(o=>`<label class="choice"><input type="radio" name="choice" value="${o}" ${a===o?'checked':''} onchange="setAnswer(this.value)"> ${o}</label>`).join('')}</div>`:`<input id="written" placeholder="정답을 입력하세요" value="${esc(a)}" oninput="setAnswer(this.value)">`;$('app').innerHTML=`<div class="card"><h2>${esc(e.title)}</h2><p class="muted">${esc(student.label)} · ${questionAt+1}/${e.questions.length}번 · 제한 시간 ${e.minutes}분 (시연용 타이머 미적용)</p><div class="question-nav">${e.questions.map((x,i)=>`<button class="${i===questionAt?'active':''}" onclick="questionAt=${i};take()">${i+1}${answers[x.id]?' ✓':''}</button>`).join('')}</div><h3>${questionAt+1}. ${esc(q.prompt)}</h3>${q.image?`<img class="preview" alt="문항 그림" src="${q.image}">`:''}${q.audio?`<audio controls src="${q.audio}"></audio>`:''}${content}<div class="row"><button ${questionAt===0?'disabled':''} onclick="questionAt--;take()">이전</button><button ${questionAt===e.questions.length-1?'disabled':''} onclick="questionAt++;take()">다음</button><button class="primary" onclick="submitExam()">시험 제출</button></div></div>`}function setAnswer(v){answers[student.exam.questions[questionAt].id]=v}function norm(x){return String(x||'').trim().replace(/\s+/g,' ').toLowerCase()}function submitExam(){let e=student.exam,missing=e.questions.filter(q=>!answers[q.id]).length;if(!confirm(`미응답 ${missing}문항입니다. 제출하시겠습니까?`))return;let total=e.questions.reduce((n,q)=>n+q.points,0),score=e.questions.reduce((n,q)=>n+(norm(answers[q.id])===norm(q.answer)?q.points:0),0);db.attempts.push({id:id(),examId:e.id,title:e.title,label:student.label,answers:structuredClone(answers),score,total,submitted:new Date().toISOString()});save();student=null;$('app').innerHTML=`<div class="card"><h2>제출 완료</h2><p>시험 답안이 저장되었습니다.</p><p class="muted">점수는 시연용 관리자 결과 화면에서만 확인할 수 있습니다.</p><button onclick="tab('students')">돌아가기</button></div>`}
function results(){$('app').innerHTML=`<div class="card"><h2>응시 결과</h2><button onclick="exportCSV()">CSV 다운로드</button>${db.attempts.map(a=>`<div class="item"><div><b>${esc(a.label)}</b> · ${esc(a.title)}<br><span class="muted">${esc(a.submitted)}</span></div><b>${a.score} / ${a.total}</b></div>`).join('')||'<p class="muted">응시 결과가 없습니다.</p>'}</div>`}function exportCSV(){let rows=[['시험','학생(가명)','점수','만점','제출시각'],...db.attempts.map(a=>[a.title,a.label,a.score,a.total,a.submitted])],csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='english-cbt-results.csv';a.click();URL.revokeObjectURL(u)}render();
</script></body></html>
