<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English CBT</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#172b4d;font:16px system-ui,'Malgun Gothic',sans-serif}header{background:#173f80;color:#fff;padding:20px 5vw;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:25px}main{max-width:1050px;margin:30px auto;padding:0 16px}.card{background:white;border-radius:16px;padding:25px;box-shadow:0 4px 18px #1b35501a;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}input,select,textarea,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #bdcbe0;max-width:100%}input,select,textarea{width:100%;margin:5px 0 12px}button{background:#1754a6;color:white;border:0;cursor:pointer;margin:4px}button.alt{background:#e8eff9;color:#173f80}button:disabled{opacity:.5;cursor:not-allowed}label{font-weight:600}nav{display:flex;flex-wrap:wrap;gap:5px}nav button{background:#e6edfa;color:#173f80}.muted{color:#60718d;font-size:14px}.choices label{display:block;padding:12px;border:1px solid #d6e0f0;margin:8px 0;border-radius:9px}.choices input{width:auto;margin-right:10px}.badge{display:inline-block;background:#e6efff;padding:5px 9px;border-radius:9px;margin:4px}.hidden{display:none}img.preview{max-width:100%;max-height:240px;object-fit:contain}audio{width:100%}table{border-collapse:collapse;width:100%}td,th{padding:10px;border-bottom:1px solid #dce4f0;text-align:left}#message{white-space:pre-wrap;color:#a32222}</style></head><body><header><h1>English CBT</h1><div><button onclick="view('student')">학생 응시</button><button onclick="view('admin')">교사 관리</button></div></header><main><p id="message" role="alert"></p><section id="student"><div class="card" id="login"><h2>학생 시험 입장</h2><p class="muted">선생님에게 받은 개인별 응시 코드를 입력하세요.</p><div class="grid"><label>학년<input id="sg" type="number" min="1" max="6"></label><label>반<input id="sc" type="number" min="1"></label><label>번호<input id="sn" type="number" min="1"></label><label>이름<input id="sname"></label></div><label>응시 코드<input id="scode" autocomplete="off"></label><button onclick="login()">시험 시작 / 이어 풀기</button></div><div id="exam" class="card hidden"><div id="meta"></div><nav id="numbers"></nav><div id="question"></div><div><button class="alt" onclick="move(-1)">이전</button><button class="alt" onclick="move(1)">다음</button><button onclick="submit()">최종 제출</button></div><p id="saveStatus" class="muted"></p></div></section><section id="admin" class="hidden"><div class="card"><h2>교사 관리자</h2><p class="muted">실제 운영 시 이 화면은 Cloudflare Access로 보호해야 합니다. 교사 이메일 인증 후 API가 작동합니다.</p><nav><button onclick="adminTab('questions')">문제은행</button><button onclick="adminTab('exams')">시험 만들기</button><button onclick="adminTab('students')">학생·코드</button><button onclick="adminTab('results')">성적</button></nav></div><div id="adminContent"></div></section></main><script>
const $=id=>document.getElementById(id),escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let token=sessionStorage.getItem('cbtToken')||'',qs=[],answers={},idx=0,deadline=0,examList=[],studentList=[];
async function api(path,method='GET',data){const opts={method,headers:{}};if(token)opts.headers.Authorization='Bearer '+token;if(data instanceof FormData)opts.body=data;else if(data!==undefined){opts.headers['content-type']='application/json';opts.body=JSON.stringify(data)}const r=await fetch('/api/'+path,opts),j=await r.json();if(!r.ok)throw Error(j.error||'요청 실패');return j}
function message(s){$('message').textContent=s||''}function view(which){$('student').classList.toggle('hidden',which!=='student');$('admin').classList.toggle('hidden',which!=='admin');message('');if(which==='admin')adminTab('questions')}
async function login(){try{const x=await api('student/login','POST',{grade:$('sg').value,class_no:$('sc').value,student_no:$('sn').value,name:$('sname').value,code:$('scode').value});token=x.token;sessionStorage.setItem('cbtToken',token);await loadExam()}catch(e){message(e.message)}}
async function loadExam(){try{const x=await api('student/current');qs=x.questions;answers=Object.fromEntries(x.responses.map(r=>[r.question_id,r.answer]));deadline=x.deadline;if(x.status==='submitted'){$('login').classList.add('hidden');$('exam').classList.remove('hidden');$('exam').innerHTML='<h2>시험 제출 완료</h2><p>점수: '+(x.score??'교사만 확인 가능')+'</p>';return}$('login').classList.add('hidden');$('exam').classList.remove('hidden');showQ()}catch(e){message(e.message)}}
function showQ(){if(!qs.length)return;const q=qs[idx];$('meta').innerHTML='<b>문제 '+(idx+1)+' / '+qs.length+'</b>　<span id="timer"></span>';$('numbers').innerHTML=qs.map((v,i)=>'<button class="'+(answers[v.id]?'':'alt')+'" onclick="idx='+i+';showQ()">'+(i+1)+'</button>').join('');let html='<h2>'+escapeHtml(q.prompt)+'</h2>';if(q.media?.image)html+='<img class="preview" src="'+escapeHtml(q.media.image)+'" alt="문제 그림">';if(q.media?.audio)html+='<audio controls src="'+escapeHtml(q.media.audio)+'"></audio>';if(['multiple','image','ox'].includes(q.type))html+='<div class="choices">'+(q.type==='ox'?['O','X']:q.choices).map((c,i)=>{const val=String(i+1);return '<label><input type="radio" name="choice" value="'+val+'" '+(answers[q.id]===val?'checked':'')+' onchange="save(this.value)"> '+(typeof c==='string'&&c.startsWith('/api/media/')?'<img class="preview" src="'+escapeHtml(c)+'">':escapeHtml(c))+'</label>'}).join('')+'</div>';else html+='<textarea id="free" rows="3" placeholder="정답을 입력하세요" oninput="delayedSave(this.value)">'+escapeHtml(answers[q.id]||'')+'</textarea>';$('question').innerHTML=html;tick()}
let saveTimer;function delayedSave(v){clearTimeout(saveTimer);saveTimer=setTimeout(()=>save(v),500)}async function save(v){const q=qs[idx];answers[q.id]=v;$('saveStatus').textContent='저장 중...';try{await api('student/answer','PUT',{questionId:q.id,answer:v});$('saveStatus').textContent='서버 저장 완료';}catch(e){$('saveStatus').textContent='저장 실패: '+e.message} }
function move(d){idx=Math.min(qs.length-1,Math.max(0,idx+d));showQ()}function tick(){const t=$('timer');if(t)t.textContent='남은 시간 '+Math.max(0,Math.ceil((deadline-Date.now())/60000))+'분'}setInterval(tick,15000);
async function submit(){if(!confirm('시험을 최종 제출할까요? 제출 후 수정할 수 없습니다.'))return;try{const r=await api('student/submit','POST',{});sessionStorage.removeItem('cbtToken');$('exam').innerHTML='<h2>제출 완료</h2><p>'+(r.score===null?'점수는 교사에게만 공개됩니다.':'점수: '+r.score)+'</p>'}catch(e){message(e.message)}}
async function adminTab(tab){message('');try{if(tab==='questions'){const items=await api('admin/questions');$('adminContent').innerHTML='<div class="card"><h2>문제 등록</h2><input id="qid" type="hidden"><div class="grid"><label>학년<input id="qgrade" type="number" value="4"></label><label>단원<input id="qunit" type="number" value="9"></label><label>영역<select id="qdomain"><option>듣기</option><option>읽기</option><option>쓰기</option></select></label><label>유형<select id="qtype"><option value="multiple">객관식</option><option value="image">그림 선택</option><option value="ox">O/X</option><option value="short">단답형</option><option value="sentence">문장 쓰기</option></select></label></div><label>문제<textarea id="qprompt"></textarea></label><label>선택지 (줄바꿈으로 구분)<textarea id="qchoices" rows="5"></textarea></label><div class="grid"><label>정답 (객관식은 1~5)<input id="qanswer"></label><label>배점<input id="qpoints" type="number" value="5"></label></div><label>그림 파일<input id="qimage" type="file" accept="image/*"></label><label>음성 파일<input id="qaudio" type="file" accept="audio/*"></label><label>기존 그림 주소<input id="qimageurl" placeholder="자동 연결"></label><label>기존 음성 주소<input id="qaudiourl" placeholder="자동 연결"></label><label><input id="qready" type="checkbox" style="width:auto"> 검수 완료 (시험에 사용 가능)</label><p><button onclick="saveQ()">문제 저장</button><button class="alt" onclick="adminTab(\'questions\')">새 문제</button></p></div><div class="card"><h2>문제은행 ('+items.length+')</h2>'+items.map((q,i)=>'<p><span class="badge">'+q.grade+'학년 '+q.unit+'단원</span> '+escapeHtml(q.prompt)+' <button class="alt" onclick="editQ('+i+')">수정</button></p>').join('')+'</div>';window.bankItems=items}
if(tab==='exams'){const [questions,exams]=await Promise.all([api('admin/questions'),api('admin/exams')]);examList=exams;$('adminContent').innerHTML='<div class="card"><h2>시험 만들기</h2><label>시험명<input id="etitle" value="4학년 9단원 평가"></label><div class="grid"><label>학년<input id="egrade" type="number" value="4"></label><label>단원<input id="eunit" type="number" value="9"></label><label>시간(분)<input id="eduration" type="number" value="40"></label><label>결과 공개<select id="epolicy"><option value="teacher">교사만</option><option value="score">점수 공개</option></select></label></div><h3>검수 완료 문제 선택</h3>'+questions.filter(q=>q.ready).map(q=>'<label style="display:block"><input class="pick" type="checkbox" value="'+q.id+'" style="width:auto"> '+escapeHtml(q.prompt)+'</label>').join('')+'<p><button onclick="createExam()">시험 생성</button></p></div><div class="card"><h2>시험 목록</h2>'+exams.map(e=>'<p>'+escapeHtml(e.title)+' ('+e.status+') <button onclick="publish(\''+e.id+'\')">공개</button></p>').join('')+'</div>'}
if(tab==='students'){const [students,exams]=await Promise.all([api('admin/students'),api('admin/exams')]);studentList=students;examList=exams;$('adminContent').innerHTML='<div class="card"><h2>학생 등록</h2><div class="grid"><label>학년<input id="ag" type="number" value="4"></label><label>반<input id="ac" type="number" value="1"></label><label>번호<input id="an" type="number"></label><label>이름<input id="anm"></label></div><button onclick="addStudent()">학생 등록</button></div><div class="card"><h2>학생별 응시 코드 발급</h2><label>시험<select id="codeExam">'+exams.map(e=>'<option value="'+e.id+'">'+escapeHtml(e.title)+'</option>').join('')+'</select></label><label>학생<select id="codeStudent">'+students.map(s=>'<option value="'+s.id+'">'+s.grade+'-'+s.class_no+'-'+s.student_no+' '+escapeHtml(s.name)+'</option>').join('')+'</select></label><button onclick="issueCode()">코드 발급</button><p id="issued"></p><p class="muted">코드는 발급 직후에만 표시됩니다. 안전한 장소에 보관해 학생에게 개별 전달하세요.</p></div>'}
if(tab==='results'){const rows=await api('admin/results');$('adminContent').innerHTML='<div class="card"><h2>응시 현황 및 성적</h2><button onclick="downloadCSV()">CSV 다운로드</button><table><tr><th>시험</th><th>학생</th><th>상태</th><th>점수</th></tr>'+rows.map(r=>'<tr><td>'+escapeHtml(r.title)+'</td><td>'+escapeHtml(r.name)+'</td><td>'+escapeHtml(r.status)+'</td><td>'+escapeHtml(r.score??'-')+'</td></tr>').join('')+'</table></div>';window.resultRows=rows}}
catch(e){message(e.message);$('adminContent').innerHTML='<div class="card">관리자 기능은 Cloudflare Access 인증 및 D1 설정 후 이용할 수 있습니다. <a href="/demo.html">로컬 기능 시연 화면</a></div>'}}
function editQ(i){const q=window.bankItems[i];for(const [id,v] of Object.entries({qid:q.id,qgrade:q.grade,qunit:q.unit,qdomain:q.domain,qtype:q.type,qprompt:q.prompt,qchoices:q.choices.join('\n'),qanswer:q.answer,qpoints:q.points,qimageurl:q.media?.image||'',qaudiourl:q.media?.audio||''}))$(''+id).value=v;$('qready').checked=!!q.ready;window.scrollTo(0,0)}
async function upload(id){const f=$(id).files[0];if(!f)return '';const form=new FormData();form.append('file',f);return (await api('admin/media','POST',form)).url}
async function saveQ(){try{const image=await upload('qimage')||$('qimageurl').value,audio=await upload('qaudio')||$('qaudiourl').value;await api('admin/questions','POST',{id:$('qid').value||undefined,grade:$('qgrade').value,unit:$('qunit').value,domain:$('qdomain').value,type:$('qtype').value,prompt:$('qprompt').value,choices:$('qchoices').value.split('\n').map(x=>x.trim()).filter(Boolean),answer:$('qanswer').value,points:$('qpoints').value,media:{image,audio},ready:$('qready').checked});await adminTab('questions');message('문제가 저장되었습니다.')}catch(e){message(e.message)}}
async function createExam(){try{await api('admin/exams','POST',{title:$('etitle').value,grade:$('egrade').value,unit:$('eunit').value,duration:$('eduration').value,result_policy:$('epolicy').value,questionIds:[...document.querySelectorAll('.pick:checked')].map(x=>x.value)});await adminTab('exams');message('시험이 생성되었습니다. 공개 버튼을 눌러야 응시할 수 있습니다.')}catch(e){message(e.message)}}
async function publish(id){if(!confirm('시험을 공개할까요?'))return;try{await api('admin/exams/'+id+'/publish','POST',{});await adminTab('exams')}catch(e){message(e.message)}}
async function addStudent(){try{await api('admin/students','POST',{grade:+$('ag').value,class_no:+$('ac').value,student_no:+$('an').value,name:$('anm').value});await adminTab('students');message('학생 등록 완료')}catch(e){message(e.message)}}
async function issueCode(){try{const x=await api('admin/codes','POST',{examId:$('codeExam').value,studentId:$('codeStudent').value});$('issued').textContent='발급된 코드: '+x.code}catch(e){message(e.message)}}
function downloadCSV(){const rows=window.resultRows||[],cols=['title','grade','class_no','student_no','name','status','score'];const csv='\ufeff'+[cols.join(','),...rows.map(r=>cols.map(c=>'"'+String(r[c]??'').replaceAll('"','""')+'"').join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='english-cbt-results.csv';a.click();URL.revokeObjectURL(a.href)}
if(token)loadExam();</script></body></html>
